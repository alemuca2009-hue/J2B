# Windows build: one-file exe for download, one-dir folder for portable use.
#
# Runs on a tag (`v1.2.0`) to publish, or by hand from the Actions tab to check a
# change without tagging. Nothing here needs a secret: the repo token that
# Actions provides is enough to attach files to a Release.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      attach_to_release:
        description: "Upload the exe to a Release named after the tag (leave empty to keep artifacts only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -e . pytest
      - name: tkinter for the self-test
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-tk || true
      - name: Run tests
        run: python -m pytest -q

  windows:
    name: windows exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q pyinstaller pytest
          python -m pip install -q -e .

      - name: Show version
        run: python -c "import j2b.version as v; print(v.__version__)"

      - name: Smoke test before freezing
        run: |
          python -m j2b --version
          python -m j2b convert --help

      - name: Build one-file exe
        run: python -m PyInstaller --noconfirm --clean packaging/j2b.spec

      - name: Build portable folder
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed `
            --name J2BStudio-portable `
            --add-data "j2b/knowledge/data;j2b/knowledge/data" `
            --add-data "j2b/data;j2b/data" `
            --hidden-import tkinter --hidden-import tkinter.ttk `
            --hidden-import tkinter.filedialog --hidden-import tkinter.messagebox `
            --exclude-module numpy --exclude-module PIL --exclude-module pytest `
            launcher.py

      - name: Verify the binaries start
        shell: pwsh
        run: |
          # A windowed exe has no console, and PowerShell does not wait for a GUI
          # subsystem process -- `& $exe` returns immediately with an empty
          # $LASTEXITCODE, which is why this check used to fail on a good build.
          # Start-Process -Wait -PassThru gives the real exit code, and the
          # self-test writes a JSON report so the log shows what was checked
          # rather than just "exit 0".
          $targets = @(
            @{ Path = "dist\J2BStudio.exe";                        Kind = "one-file" },
            @{ Path = "dist\J2BStudio-portable\J2BStudio-portable.exe"; Kind = "portable" }
          )
          $failed = @()
          foreach ($t in $targets) {
            if (-not (Test-Path $t.Path)) { throw "$($t.Kind) build was not produced: $($t.Path)" }
            $size = (Get-Item $t.Path).Length
            Write-Host "$($t.Kind): $($t.Path) - $([math]::Round($size/1MB,2)) MB"
            if ($size -lt 3MB) { throw "$($t.Kind) exe is suspiciously small: $size bytes" }

            $report = Join-Path $env:RUNNER_TEMP "selftest-$($t.Kind).json"
            if (Test-Path $report) { Remove-Item $report -Force }
            $proc = Start-Process -FilePath $t.Path -ArgumentList "--j2b-selftest", "--j2b-selftest-report=$report" -Wait -PassThru
            Write-Host "$($t.Kind) exit code: $($proc.ExitCode)"

            if (Test-Path $report) {
              $json = Get-Content $report -Raw | ConvertFrom-Json
              Write-Host "version: $($json.version)  python: $($json.python)  ok: $($json.ok)"
              foreach ($c in $json.checks) {
                Write-Host ("  {0,-16} {1}  {2}" -f $c.name, $(if ($c.ok) { "ok  " } else { "FAIL" }), $c.detail)
              }
              if (-not $json.ok) { $failed += "$($t.Kind): self-test reported failures" }
            } else {
              $failed += "$($t.Kind): no JSON report written (exit $($proc.ExitCode))"
            }
            if ($proc.ExitCode -ne 0) { $failed += "$($t.Kind): exit code $($proc.ExitCode)" }
          }
          if ($failed.Count -gt 0) { throw ($failed -join "; ") }
          Write-Host "both binaries passed the self-test"

      - name: Keep the self-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-reports
          path: ${{ runner.temp }}/selftest-*.json
          if-no-files-found: warn

      - name: Package
        shell: pwsh
        run: |
          $v = (python -c "import j2b.version as v; print(v.__version__)").Trim()
          Copy-Item dist\J2BStudio.exe "dist\J2BStudio-$v-windows-x64.exe"
          Compress-Archive -Path dist\J2BStudio-portable\* -DestinationPath "dist\J2BStudio-$v-portable-windows-x64.zip" -Force
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: J2BStudio-windows-x64
          path: |
            dist/J2BStudio-*.exe
            dist/J2BStudio-*-portable-windows-x64.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/J2BStudio-*.exe
            dist/J2BStudio-*-portable-windows-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
